<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>油画漫游</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #1c1512; overflow: hidden; }
      #view, #view canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #d9b98a; font: 15px/1.4 Georgia, "Noto Serif SC", "Songti SC", SimSun, serif; letter-spacing: 0.08em; }
      #hint { position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%); color: #f3e3c3; font: 14px/1.6 Georgia, "Noto Serif SC", "Songti SC", SimSun, serif; letter-spacing: 0.04em;
        background: rgba(28, 20, 18, 0.55); padding: 8px 16px; border-radius: 3px; transition: opacity 2s; pointer-events: none; width: max-content; max-width: calc(100% - 36px); box-sizing: border-box; text-align: center; }
      #hint.faded { opacity: 0; }
      #hint.off { display: none; }
      html[data-scene='aurora'] body { background: #061219; }
      html[data-scene='aurora'] #loading { color: #9fd8c4; }
      #scenes { position: fixed; left: 18px; bottom: 18px; display: flex; gap: 6px; max-width:calc(100vw - 36px); flex-wrap:wrap; }
      #scenes button { font: 13px/1.4 Georgia, "Noto Serif SC", "Songti SC", SimSun, serif; letter-spacing: 0.04em; color: #f3e3c3; background: rgba(28, 20, 18, 0.55); border: 1px solid rgba(243, 227, 195, 0.25);
        padding: 8px 12px; border-radius: 3px; cursor: pointer; }
      #scenes button.on { background: rgba(243, 227, 195, 0.9); color: #1c1512; cursor: default; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="loading">正在调配颜料…</div>
    <div id="scenes"><button data-scene="aurora" tabindex="-1">极光雪岭</button><button data-scene="autumn" tabindex="-1">秋日森林</button><button data-scene="alpine" tabindex="-1">雪山牧场</button><button data-scene="village" tabindex="-1">柏树麦田</button><button data-scene="arches" tabindex="-1">红岩双拱</button></div>
    <div id="hint">点击画面转动视角 · WASD 移动 · Shift 冲刺 · 空格 跳跃 · 滚轮 调整视距 · H 隐藏提示</div>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
